<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#061420" />
    <meta
      name="description"
      content="Go / no-go fishing windows for small boats between Baffle Creek and Walkers Point, Queensland."
    />
    <!-- Only this site's own files may load; the only outside connection is the Open-Meteo forecast. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.open-meteo.com https://marine-api.open-meteo.com https://ensemble-api.open-meteo.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>Fishin' Control — go / no-go for the Bundaberg coast</title>
    <link rel="icon" href="icon-64.png" type="image/png" sizes="64x64" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://marine-api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://ensemble-api.open-meteo.com" crossorigin />
    <link rel="preload" href="font-outfit.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="font-space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <!-- Every module, so the browser fetches them in parallel instead of discovering imports one level at a time. -->
    <link rel="modulepreload" href="config.js" />
    <link rel="modulepreload" href="util.js" />
    <link rel="modulepreload" href="alerts.js" />
    <link rel="modulepreload" href="store.js" />
    <link rel="modulepreload" href="data.js" />
    <link rel="modulepreload" href="astro.js" />
    <link rel="modulepreload" href="advice.js" />
    <link rel="modulepreload" href="model.js" />
    <link rel="modulepreload" href="art.js" />
    <link rel="modulepreload" href="importer.js" />
    <link rel="modulepreload" href="map.js" />
    <link rel="modulepreload" href="closures.js" />
    <link rel="modulepreload" href="ui.js" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <!-- Loading screen, shown from the first paint until the first forecast is drawn (app.js removes it). -->
    <div class="splash" id="splash" role="status">
      <div class="splash-radar" aria-hidden="true">
        <img class="splash-logo" src="logo-448.webp" width="148" height="148" alt="" />
      </div>
      <div class="splash-mark">Fishin'<span>Control</span></div>
      <div class="splash-tag">Launch control · Bundaberg coast</div>
      <div class="splash-load">
        <span class="splash-msg">Reading the water…</span>
        <div
          class="splash-bar"
          role="progressbar"
          aria-label="Loading the forecast"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <i id="splashFill"></i>
        </div>
      </div>
      <p class="boot-help">
        Still nothing after a few seconds? Some of the app's files are missing from the site. Every file in
        the download has to be uploaded to the repository, alongside index.html.
      </p>
      <svg class="splash-swell" viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 22q25 -9 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0" />
        <path d="M0 38q25 -9 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0" />
        <path d="M0 54q25 -9 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0" />
      </svg>
    </div>
    <div class="wrap">
      <header class="top">
        <img class="logo" src="logo-128.webp" width="38" height="38" alt="" />
        <div class="mark">Fishin'<span> Control</span></div>
        <button class="ghost" id="install" hidden>Install</button>
        <button class="ghost" id="reload">Refresh</button>
        <div class="stamp" id="stamp" aria-live="polite"></div>
      </header>
      <main id="app">
        <div class="state">Reading the water…</div>
      </main>
    </div>
    <noscript>
      <style>
        .splash {
          display: none;
        }
      </style>
      <p class="state">Fishin' Control needs JavaScript switched on.</p>
    </noscript>
  </body>
</html>
